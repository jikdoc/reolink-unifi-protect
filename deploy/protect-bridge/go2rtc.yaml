# Relay for the protect-bridge proxies and Scrypted: pulls each camera's MAIN
# stream once (only while someone is watching it). One stream per camera, never
# main + sub. ${...} values come from .env via env_file.
#
# RTSP is reachable on the camera VLAN (Scrypted, CT 302) and needs the relay
# login (RELAY_USER / RELAY_PASS); the API stays on loopback.
#
# The streams module's warnings print the full camera URL, password included,
# so only errors are logged there. Camera dropouts still show up as pipeline
# restarts in the proxy logs.
log:
  streams: error
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: ":8554"
  username: ${RELAY_USER}
  password: ${RELAY_PASS}
webrtc:
  listen: ""
srtp:
  listen: ""

# Sub-stream presets: decode + scale on the CPU, encode H.264 on the iGPU in
# low-power (VDENC) mode, which keeps the encode off the busy render engine (2026-10-22).
# Hardware HEVC decode of these main streams hung the shared iGPU (2026-10-19,
# "GPU HANG ... in dec0:0:hevc"), taking Scrypted and Immich down with it; the
# encoder was never involved. ~0.5 core per stream vs ~2 for all-software.
ffmpeg:
  h264_sub720: -init_hw_device vaapi=va:/dev/dri/renderD128 -filter_hw_device va -vf scale=1920:720,format=nv12,hwupload -c:v h264_vaapi -low_power 1 -b:v 2M -maxrate 3M -g 20 -bf 0
  h264_sub576: -init_hw_device vaapi=va:/dev/dri/renderD128 -filter_hw_device va -vf scale=1920:576,format=nv12,hwupload -c:v h264_vaapi -low_power 1 -b:v 2M -maxrate 3M -g 20 -bf 0
  # Portrait (3:4) cut for the Doorbell Deck.
  h264_sub1440p: -init_hw_device vaapi=va:/dev/dri/renderD128 -filter_hw_device va -vf scale=1080:1440,format=nv12,hwupload -c:v h264_vaapi -low_power 1 -b:v 2M -maxrate 3M -g 20 -bf 0
  # Doorbell Deck main cut to 1536x2048 (3:4) so it fits the AI Port 3840x2160 limit
  # (the camera only offers 1920x2560). Its main is H.264, so it is decoded and scaled
  # on the iGPU too (2026-10-22: 0.41 -> 0.01 core); only HEVC decode hung the iGPU.
  # Needs #input=rtsp_vaapi so the frames arrive as VAAPI surfaces.
  rtsp_vaapi: -hwaccel vaapi -hwaccel_device /dev/dri/renderD128 -hwaccel_output_format vaapi -fflags nobuffer -flags low_delay -timeout 5000000 -user_agent go2rtc/ffmpeg -rtsp_flags prefer_tcp -i {input}
  h264_2048p: -vf scale_vaapi=w=1536:h=2048:format=nv12 -c:v h264_vaapi -low_power 1 -b:v 4M -maxrate 5M -g 20 -bf 0
  # E1 Outdoor Pro lo channels (main switched to H.264 2026-10-23, so iGPU decode is safe).
  h264_1080p: -vf scale_vaapi=w=1920:h=1080:format=nv12 -c:v h264_vaapi -low_power 1 -b:v 1500k -maxrate 2M -g 20 -bf 0
  # Small stream for Scrypted's HomeKit view of the H.265 pass-through cameras
  # (and its motion detection), whose Protect RTSP share has no video.
  h264_sub360: -init_hw_device vaapi=va:/dev/dri/renderD128 -filter_hw_device va -vf scale=640:360,format=nv12,hwupload -c:v h264_vaapi -low_power 1 -b:v 512k -maxrate 768k -g 25 -bf 0

streams:
  elite_sophia: rtsp://${CAM_USER}:${CAM_PASS_URL}@${CAM_IP}:554/h264Preview_01_main
  back_gate: rtsp://${CAM_USER}:${CAM_PASS_URL}@${BG_IP}:554/h264Preview_01_main
  # TrackMix WiFi wide lens (main H.265 3840x2160@25); tele lens not relayed.
  track_masterbed: rtsp://${CAM_USER}:${CAM_PASS_URL}@${MB_IP}:554/h264Preview_01_main
  # TrackMix WiFi "Track Annex" wide lens (main H.265 3840x2160@25).
  track_annex: rtsp://${CAM_USER}:${CAM_PASS_URL}@${TA_IP}:554/h264Preview_01_main
  # E1 Zoom (main 2560x1920@20) and E1 Outdoor Pro (main H.265 3840x2160@20).
  e1_forest: rtsp://${CAM_USER}:${CAM_PASS_URL}@${FO_IP}:554/h264Preview_01_main
  e1_playroom: rtsp://${CAM_USER}:${CAM_PASS_URL}@${PL_IP}:554/h264Preview_01_main
  e1_server: rtsp://${CAM_USER}:${CAM_PASS_URL}@${SV_IP}:554/h264Preview_01_main
  e1_deck_middle: rtsp://${CAM_USER}:${CAM_PASS_URL}@${DM_IP}:554/h264Preview_01_main
  # Protect video2/video3 for the E1 Outdoor Pros: iGPU decode + scale + encode of the H.264 main.
  e1_server_lo: ffmpeg:e1_server#input=rtsp_vaapi#video=h264_1080p#audio=copy
  e1_deck_middle_lo: ffmpeg:e1_deck_middle#input=rtsp_vaapi#video=h264_1080p#audio=copy
  # Reolink Video Doorbell WiFi-W (main H.264 1920x2560 portrait @20).
  deck_doorbell: rtsp://${CAM_USER}:${CAM_PASS_URL}@${DD_IP}:554/h264Preview_01_main
  # What protect-bridge (and so the AI Port) reads for the Doorbell Deck.
  deck_doorbell_hq: ffmpeg:deck_doorbell#input=rtsp_vaapi#video=h264_2048p#audio=copy
  # Scrypted: full stream = track_masterbed / track_annex (copy). HomeKit = these:
  # 2026-10-23 the cameras own sub stream (896x512 H.264 15fps), copied - was a
  # CPU decode of the 4K main + h264_sub360 encode (~0.65 core each).
  track_masterbed_motion: rtsp://${CAM_USER}:${CAM_PASS_URL}@${MB_IP}:554/h264Preview_01_sub
  track_annex_motion: rtsp://${CAM_USER}:${CAM_PASS_URL}@${TA_IP}:554/h264Preview_01_sub
