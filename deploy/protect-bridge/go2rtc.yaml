# Relay for the protect-bridge proxies and Scrypted: pulls each camera's MAIN
# stream once (only while someone is watching it). One stream per camera, never
# main + sub. ${...} values come from .env via env_file.
#
# RTSP is reachable on the camera VLAN (Scrypted, CT 302) and needs the relay
# login (RELAY_USER / RELAY_PASS); the API stays on loopback.
#
# The streams module's warnings print the full camera URL, password included,
# so only errors are logged there. Camera dropouts still show up as pipeline
# restarts in the proxy logs.
log:
  streams: error
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: ":8554"
  username: ${RELAY_USER}
  password: ${RELAY_PASS}
webrtc:
  listen: ""
srtp:
  listen: ""

streams:
  elite_sophia: rtsp://${CAM_USER}:${CAM_PASS_URL}@${CAM_IP}:554/h264Preview_01_main
  back_gate: rtsp://${CAM_USER}:${CAM_PASS_URL}@${BG_IP}:554/h264Preview_01_main
  # What Scrypted/HomeKit used from the camera's sub stream (H.264 1920x720),
  # now cut from the relay's main stream, on demand only. Software, not VAAPI:
  # hardware HEVC decode of these main streams hung the shared iGPU (2026-10-19,
  # "GPU HANG ... in dec0:0:hevc"), taking Scrypted and Immich down with it.
  back_gate_sub: ffmpeg:back_gate#video=h264#width=1920#height=720#audio=copy
  # Ready for Elite Sophia's move to Scrypted's RTSP plugin (camera sub stream
  # was H.264 1920x576).
  elite_sophia_sub: ffmpeg:elite_sophia#video=h264#width=1920#height=576#audio=copy
