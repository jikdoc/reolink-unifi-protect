# Relay for the protect-bridge proxies: pulls each camera's MAIN stream once
# (only while someone is watching it) and serves it on loopback. One stream per
# camera, never main + sub. ${...} values come from .env via env_file.
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: "127.0.0.1:8554"
webrtc:
  listen: ""
srtp:
  listen: ""

streams:
  elite_sophia: rtsp://${CAM_USER}:${CAM_PASS_URL}@${CAM_IP}:554/h264Preview_01_main
  back_gate: rtsp://${CAM_USER}:${CAM_PASS_URL}@${BG_IP}:554/h264Preview_01_main
