# Relay for the protect-bridge proxies and Scrypted: pulls each camera's MAIN
# stream once (only while someone is watching it). One stream per camera, never
# main + sub. ${...} values come from .env via env_file.
#
# RTSP is reachable on the camera VLAN (Scrypted, CT 302) and needs the relay
# login (RELAY_USER / RELAY_PASS); the API stays on loopback.
#
# The streams module's warnings print the full camera URL, password included,
# so only errors are logged there. Camera dropouts still show up as pipeline
# restarts in the proxy logs.
log:
  streams: error
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: ":8554"
  username: ${RELAY_USER}
  password: ${RELAY_PASS}
webrtc:
  listen: ""
srtp:
  listen: ""

# Transcode presets for the two NVIDIA cards in CT 319 (pvebig). The 27B model
# shares both cards and GPU 1 also carries its vision part, so the transcodes
# are split: the E1 lo cuts on GPU 1, the Doorbell Deck cut on GPU 0
# (2026-11-12). Unused presets (h264_sub*) are kept for reference.
ffmpeg:
  h264_sub720: -init_hw_device cuda=cu:1 -filter_hw_device cu -vf scale=1920:720,format=nv12,hwupload_cuda -c:v h264_nvenc -gpu 1 -preset p4 -tune ll -b:v 2M -maxrate 3M -g 20 -bf 0
  h264_sub576: -init_hw_device cuda=cu:1 -filter_hw_device cu -vf scale=1920:576,format=nv12,hwupload_cuda -c:v h264_nvenc -gpu 1 -preset p4 -tune ll -b:v 2M -maxrate 3M -g 20 -bf 0
  # Portrait (3:4) cut for the Doorbell Deck.
  h264_sub1440p: -init_hw_device cuda=cu:1 -filter_hw_device cu -vf scale=1080:1440,format=nv12,hwupload_cuda -c:v h264_nvenc -gpu 1 -preset p4 -tune ll -b:v 2M -maxrate 3M -g 20 -bf 0
  # Doorbell Deck main cut to 1536x2048 (3:4) so it fits the AI Port 3840x2160 limit
  # (the camera only offers 1920x2560). Needs #input=rtsp_cuda0 so the frames arrive
  # as CUDA surfaces. "-map 0:v:0" makes ffmpeg exit when go2rtc hands it an
  # audio-only input (2026-11-10: 17 h without doorbell video).
  rtsp_cuda: -hwaccel cuda -hwaccel_device 1 -hwaccel_output_format cuda -c:v h264_cuvid -gpu 1 -fflags nobuffer -flags low_delay -timeout 5000000 -user_agent go2rtc/ffmpeg -rtsp_flags prefer_tcp -i {input}
  rtsp_cuda0: -hwaccel cuda -hwaccel_device 0 -hwaccel_output_format cuda -c:v h264_cuvid -gpu 0 -fflags nobuffer -flags low_delay -timeout 5000000 -user_agent go2rtc/ffmpeg -rtsp_flags prefer_tcp -i {input}
  h264_2048p: -vf scale_cuda=1536:2048 -c:v h264_nvenc -gpu 0 -preset p4 -tune ll -b:v 4M -maxrate 5M -g 20 -bf 0 -map 0:v:0 -map 0:a?
  # E1 Outdoor Pro lo channels (main is H.264 since 2026-10-23).
  h264_1080p: -vf scale_cuda=1920:1080 -c:v h264_nvenc -gpu 1 -preset p4 -tune ll -b:v 1500k -maxrate 2M -g 20 -bf 0 -map 0:v:0 -map 0:a?
  # Small stream for Scrypted's HomeKit view of the H.265 pass-through cameras
  # (and its motion detection), whose Protect RTSP share has no video.
  h264_sub360: -init_hw_device cuda=cu:1 -filter_hw_device cu -vf scale=640:360,format=nv12,hwupload_cuda -c:v h264_nvenc -gpu 1 -preset p4 -tune ll -b:v 512k -maxrate 768k -g 25 -bf 0

streams:
  # 2026-11-12: Elite Sophia and Back Gate moved to reostream (Baichuan) now that the
  # MoCA leg is gone. Old direct-RTSP lines: go2rtc.yaml.bak-20261112-pre-revisit.
  elite_sophia: rtsp://127.0.0.1:8561/elite_sophia
  back_gate: rtsp://127.0.0.1:8561/back_gate
  # Back Gate H.264 sub (1920x720): source for its Protect lo channels (h264_cuvid +
  # hevc_nvenc in the proxy), instead of decoding the H.265 main.
  back_gate_sub: rtsp://127.0.0.1:8561/back_gate_sub
  # Duo Generator (2026-10-29): direct RTSP, not reostream (its Baichuan session idled out
  # behind the MoCA on 10-25). Main H.265 4608x1728 passed through; H.264 sub 1536x576
  # feeds the lo channels (iGPU H.264 decode), the Back Gate pattern.
  duo_generator: rtsp://${CAM_USER}:${CAM_PASS_URL}@${DG_IP}:554/h264Preview_01_main
  duo_generator_sub: rtsp://${CAM_USER}:${CAM_PASS_URL}@${DG_IP}:554/h264Preview_01_sub
  # Elite Guest Bed (2026-10-29): direct RTSP. Main H.265 5120x1552 passed through; H.264 sub
  # 1920x576 feeds the lo channels (iGPU H.264 decode). Main+sub tested 400/400 + 400/400.
  elite_guest_bed: rtsp://${CAM_USER}:${CAM_PASS_URL}@${EGB_IP}:554/h264Preview_01_main
  elite_guest_bed_sub: rtsp://${CAM_USER}:${CAM_PASS_URL}@${EGB_IP}:554/h264Preview_01_sub
  # 2026-10-25 reostream trial: the four TrackMix sources below come from reostream
  # (Baichuan) instead of the cameras RTSP. Old lines: go2rtc.yaml.bak-20261025-pre-reostream.
  # TrackMix WiFi wide lens (main H.265 3840x2160@25); tele lens not relayed.
  track_masterbed: rtsp://127.0.0.1:8561/masterbed
  # TrackMix WiFi "Track Annex" wide lens (main H.265 3840x2160@25).
  track_annex: rtsp://127.0.0.1:8561/annex
  # E1 Zoom (main 2560x1920@20) and E1 Outdoor Pro (main H.265 3840x2160@20).
  e1_forest: rtsp://127.0.0.1:8561/e1_forest
  e1_playroom: rtsp://127.0.0.1:8561/e1_playroom
  e1_server: rtsp://127.0.0.1:8561/e1_server
  e1_deck_middle: rtsp://127.0.0.1:8561/e1_deck_middle
  # Protect video2/video3 for the E1 Outdoor Pros: GPU decode + scale + encode of the H.264 main.
  e1_server_lo: ffmpeg:e1_server#input=rtsp_cuda#video=h264_1080p#audio=copy
  e1_deck_middle_lo: ffmpeg:e1_deck_middle#input=rtsp_cuda#video=h264_1080p#audio=copy
  # Reolink Video Doorbell WiFi-W (main H.264 1920x2560 portrait @20).
  deck_doorbell: rtsp://127.0.0.1:8561/deck_doorbell
  # What protect-bridge (and so the AI Port) reads for the Doorbell Deck.
  deck_doorbell_hq: ffmpeg:deck_doorbell#input=rtsp_cuda0#video=h264_2048p#audio=copy
  # Scrypted: full stream = track_masterbed / track_annex (copy). HomeKit = these:
  # 2026-10-23 the cameras own sub stream (896x512 H.264 15fps), copied - was a
  # CPU decode of the 4K main + h264_sub360 encode (~0.65 core each).
  track_masterbed_motion: rtsp://127.0.0.1:8561/masterbed_sub
  track_annex_motion: rtsp://127.0.0.1:8561/annex_sub

  # Track Sophia (bridge, 2026-10-26): Baichuan via reostream, like the twins.
  track_sophia: rtsp://127.0.0.1:8561/sophia
  track_sophia_motion: rtsp://127.0.0.1:8561/sophia_sub
