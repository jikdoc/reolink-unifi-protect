# Homelab: Reolink cameras -> UniFi Protect on the UNVR, from CT 319
# "protect-bridge" on pvebig (two NVIDIA RTX PRO 4000; moved from the Intel
# iGPU in CT 318 on pvemed 2026-11-02).
#
# The relay (go2rtc) pulls each camera once, mostly through reostream
# (Baichuan); every Protect channel reads from the relay. video1 passes the
# main stream through untouched; video2/3 are either cut from the main on the
# GPU (--lo-shared --lo-scale: hevc_cuvid -> scale_cuda -> hevc_nvenc, one
# ffmpeg for both) or re-encoded from the camera's H.264 sub.
# Use hevc_cuvid, not the native decoder with -hwaccel cuda: the native one
# fell out of hardware on two cameras. Intel iGPU HEVC decode hung the GPU on
# these streams (2026-10-19/22), which is why this left pvemed.
# Main + sub from one camera is fine on a clean link (re-tested 2026-10-29);
# avoid it only on weak Wi-Fi. The Baichuan box sidecar stays off; detections
# come from the camera's push channel.
#
# The cameras serve their API on plain HTTP only (HTTPS off), and reject
# user/password-in-URL logins because the password has special characters:
# --reolink-scheme http and --reolink-snapshot (token login) cover both.
#
# Secrets live only in ./.env next to this file (gitignored, mode 600), see
# .env.example, plus ./client.pem (README quickstart). Each camera needs its own
# virtual MAC and its own adoption token.
#
# Protect caches model/codec/resolution at ADOPTION. Changing any of those flags
# means: remove the camera in Protect, put a fresh token in .env (tokens live
# ~60 min), then `docker compose up -d --no-deps --force-recreate <service>`.
# Always --no-deps when touching one camera: without it compose also recreates
# the relay and every other camera's feed drops (seen 2026-10-19).
#
# Never adopt a camera twice: remove its third-party adoption in Protect and
# exclude its MAC (and the virtual MAC) in onvif-recorder first.
#
# Image: docker build -t protect-bridge:nvenc -f Dockerfile.vaapi /opt/rup
# (Debian's ffmpeg already has cuvid/nvenc). Tag the old image first for rollback.

x-proxy: &proxy
  image: protect-bridge:nvenc
  restart: unless-stopped
  init: true  # tini reaps orphaned ffmpeg/nc/bash after pipeline restarts (zombies piled up)
  # Host networking: the proxy only connects out (Protect on 7442, the relay
  # on loopback, the camera's HTTP API and Baichuan push).
  network_mode: host
  depends_on:
    - relay
  runtime: nvidia
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
  volumes:
    - ./client.pem:/client.pem:ro
    # Bounded scratch space for snapshots and crops; a restart wipes it.
    - type: tmpfs
      target: /tmp
      tmpfs:
        size: 536870912 # 512 MiB
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # reostream trial 2026-10-25 (github.com/VoltTech21/reostream, AGPL, run unmodified):
  # pulls masterbed/annex/duo_side/duo_back over Reolink Baichuan (port 9000) and serves
  # RTSP on 127.0.0.1:8561 for the relay. Status: curl 127.0.0.1:8560/api/status.
  # Rollback: restore go2rtc.yaml.bak-20261025-pre-reostream, restart relay, stop this.
  reostream:
    image: ghcr.io/volttech21/reostream:0.2.7
    container_name: protect-bridge-reostream
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./reostream:/data

  relay:
    # -hardware variant (ffmpeg with cuvid/nvenc). 1.9.15 since 2026-11-12. Its first
    # try that day failed because relay transcodes used #audio=copy (see go2rtc.yaml).
    # Rollback: alexxit/go2rtc:1.9.9-hardware@sha256:7d78c5843ca6bbe6bdd1f3cfd5a7708c7a6a30817c2996113de000cf09fcd741
    image: alexxit/go2rtc:1.9.15-hardware
    container_name: protect-bridge-relay
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    # Supplies the ${...} values used in go2rtc.yaml.
    env_file: .env
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Reolink Elite Floodlight WiFi "Elite Sophia", firmware v3.2.0.5607:
  # main H.265 5120x1552@20 (3 Mbps).
  elite-sophia:
    <<: *proxy
    build:
      context: ../..
      dockerfile: Dockerfile.vaapi
    container_name: protect-bridge-elite-sophia
    command:
      - unifi-cam-proxy
      - --host
      - "${NVR_IP}"
      - --cert
      - /client.pem
      - --token
      - "${ADOPTION_TOKEN}"
      - --mac
      - "${CAM_MAC}"
      - --ip
      - "${CAM_IP}"
      - --name
      - "${CAM_NAME}"
      # Full UVC G5 Pro identity (unlocks Protect's H.265 capability gate).
      - --model
      - "UVC G5 Pro"
      - --sysid
      - "0xa598"
      - --platform
      - "sav837gw"
      - --fw-version
      - "5.5.45"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - "rtsp://${RELAY_USER}:${RELAY_PASS}@127.0.0.1:8554/elite_sophia"
      - --reolink-ai-host
      - "${CAM_IP}"
      - --reolink-ai-user
      - "${CAM_USER}"
      - --reolink-ai-password
      - "${CAM_PASS}"
      - --reolink-scheme
      - http
      - --reolink-snapshot
      - --reolink-push-ai
      # ffmpeg 7.1 stalls on copied Reolink audio (the muxer holds all video
      # for 10 s and Protect times out): re-encode it, 16 kHz mono as the
      # camera sends it, on every channel.
      - --ffmpeg-args
      - "-c:v copy -ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --lo-audio-args
      - "-ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --hi-codec
      - h265
      - --hi-width
      - "5120"
      - --hi-height
      - "1552"
      - --hi-fps
      - "20"
      - --lo-codec
      - h265
      - --lo-h265-transcode
      - --lo-transcode-bitrate
      - "1M"
      # One ffmpeg for video2 + video3 (one decode instead of two).
      - --lo-shared
      - --lo-scale
      - --hw-backend
      - nvenc
      - --nv-gpu
      - "0"
      - --lo-source-codec
      - hevc
      - --lo-width
      - "1920"
      - --lo-height
      - "576"
      - --lo-fps
      - "20"
      # Shorter recording gaps per stall (default 45 s / 15 s). Kept after the
      # fiber (2026-11-12): still fires a few times a week on real stalls.
      - --stream-silence-limit
      - "20"
      - --stream-watchdog-interval
      - "5"

  # Reolink OMVI 3i PoE "Back Gate" (wired), firmware v3.2.0.6905:
