      - --name
      - "${BG_NAME}"
      - --model
      - "UVC G5 Pro"
      - --sysid
      - "0xa598"
      - --platform
      - "sav837gw"
      - --fw-version
      - "5.5.31"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - "rtsp://${RELAY_USER}:${RELAY_PASS}@127.0.0.1:8554/back_gate"
      - "rtsp://${RELAY_USER}:${RELAY_PASS}@127.0.0.1:8554/back_gate_sub"
      - --reolink-ai-host
      - "${BG_IP}"
      - --reolink-ai-user
      - "${CAM_USER}"
      - --reolink-ai-password
      - "${CAM_PASS}"
      - --reolink-scheme
      - http
      - --reolink-snapshot
      - --reolink-push-ai
      # ffmpeg 7.1 stalls on copied Reolink audio (the muxer holds all video
      # for 10 s and Protect times out): re-encode it, 16 kHz mono as the
      # camera sends it, on every channel.
      - --ffmpeg-args
      - "-c:v copy -ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --lo-audio-args
      - "-ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --hi-codec
      - h265
      - --hi-width
      - "4096"
      - --hi-height
      - "1536"
      - --hi-fps
      - "20"
      - --lo-codec
      - h265
      - --lo-h265-transcode
      # Low-power (VDENC) encode: keeps the lo encodes off the iGPU render
      # engine (RCS hit 97% with 6 cameras on CPU decode, 2026-10-22). Injected
      # through the bitrate value because the encoder args are fixed in code.
      - --lo-transcode-bitrate
      - "1M"
      - --lo-low-power
      # 2026-10-23: video2/3 read the camera's H.264 sub (relay back_gate_sub, already
      # 1920x720) and decode it on the iGPU (H.264 only - HEVC iGPU decode hangs);
      # was --lo-scale + --lo-decode cpu of the H.265 main (~0.6 core).
      - --lo-decode
      - qsv
      # 15 s (10-19) and 45 s (10-22) both gave ~30 restarts/h on the MoCA link;
      # 45 s only made each gap longer. 20 s from 2026-10-22. Revisit after the fiber.
      - --stream-silence-limit
      - "20"
      - --stream-watchdog-interval
      - "5"
      - --lo-width
      - "1920"
      - --lo-height
      - "720"
      - --lo-fps
      - "20"

