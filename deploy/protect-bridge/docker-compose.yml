      - "0xa598"
      - --platform
      - "sav837gw"
      - --fw-version
      - "5.5.45"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - "rtsp://${RELAY_USER}:${RELAY_PASS}@127.0.0.1:8554/back_gate"
      - "rtsp://${RELAY_USER}:${RELAY_PASS}@127.0.0.1:8554/back_gate_sub"
      - --reolink-ai-host
      - "${BG_IP}"
      - --reolink-ai-user
      - "${CAM_USER}"
      - --reolink-ai-password
      - "${CAM_PASS}"
      - --reolink-scheme
      - http
      # --ptz removed 2026-10-25 per user request (camera PTZ verified working
      # directly, but keep the bridge UI unchanged).
      - --reolink-snapshot
      - --reolink-push-ai
      # ffmpeg 7.1 stalls on copied Reolink audio (the muxer holds all video
      # for 10 s and Protect times out): re-encode it, 16 kHz mono as the
      # camera sends it, on every channel.
      - --ffmpeg-args
      - "-c:v copy -ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --lo-audio-args
      - "-ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --hi-codec
      - h265
      - --hi-width
      - "5120"
      - --hi-height
      - "1920"
      - --hi-fps
      - "20"
      - --lo-codec
      - h265
      - --lo-h265-transcode
      - --lo-transcode-bitrate
      - "1M"
      # video2/3 read the camera's H.264 sub (relay back_gate_sub, already 1920x720).
      # 2026-11-12: one ffmpeg for video2 + video3. The 2026-10-22 try looped on
      # EPIPE after MoCA stalls; the MoCA leg is gone. Rollback: drop --lo-shared.
      - --lo-shared
      - --hw-backend
      - nvenc
      - --nv-gpu
      - "1"
      - --lo-source-codec
      - h264
      # Revisited 2026-11-12 after the fiber: kept at 20 s. It still fires about
      # once a day and each firing is a real stall that the default (45 s) would
      # leave recording nothing for longer.
      - --stream-silence-limit
      - "20"
      - --stream-watchdog-interval
      - "5"
      - --lo-width
      - "1920"
      - --lo-height
      - "720"
      - --lo-fps
      - "20"

