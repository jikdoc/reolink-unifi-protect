# Homelab: Reolink cameras -> UniFi Protect 7.3.70 on the UNVR, from CT 318
# "protect-bridge" on pvemed.
#
# ONE STREAM PER CAMERA (house rule): the relay (go2rtc) pulls each camera's
# MAIN stream once; every Protect channel reads from the relay. video1 passes
# the main stream through untouched (H.265); video2/3 are cut from it
# (--lo-h265-transcode --lo-scale): decoded and scaled on the CPU
# (--lo-decode cpu, ~0.4 core per camera) and only encoded on the i7-12700 iGPU,
# because the iGPU's HEVC decoder hung on these streams (2026-10-19, on both
# the xe and i915 drivers). To try the iGPU again (e.g. after the garage fiber),
# drop --lo-decode cpu and watch `dmesg | grep "GPU HANG"` on pvemed. The camera's sub stream is
# never used. Measured 2026-10-19 on Wi-Fi Elite Sophia: main alone 399/400
# frames, main + sub together only 249/400, so Protect timed out every channel.
# The Baichuan box sidecar is off for the same reason (it opens a second video
# stream during detections); detections come from the camera's push channel.
#
# The cameras serve their API on plain HTTP only (HTTPS off), and reject
# user/password-in-URL logins because the password has special characters:
# --reolink-scheme http and --reolink-snapshot (token login) cover both.
#
# Secrets live only in ./.env next to this file (gitignored, mode 600), see
# .env.example, plus ./client.pem (README quickstart). Each camera needs its own
# virtual MAC and its own adoption token.
#
# Protect caches model/codec/resolution at ADOPTION. Changing any of those flags
# means: remove the camera in Protect, put a fresh token in .env (tokens live
# ~60 min), then `docker compose up -d --no-deps --force-recreate <service>`.
# Always --no-deps when touching one camera: without it compose also recreates
# the relay and every other camera's feed drops (seen 2026-10-19).
#
# Never adopt a camera twice: remove its third-party adoption in Protect and
# exclude its MAC (and the virtual MAC) in onvif-recorder first.
#
#   cd /opt/rup/deploy/protect-bridge && docker compose up -d --build

x-proxy: &proxy
  image: protect-bridge:pinned
  restart: unless-stopped
  # Host networking: the proxy only connects out (Protect on 7442, the relay
  # on loopback, the camera's HTTP API and Baichuan push).
  network_mode: host
  depends_on:
    - relay
  devices:
    - /dev/dri:/dev/dri
  group_add:
    - video
  volumes:
    - ./client.pem:/client.pem:ro
    # Bounded scratch space for snapshots and crops; a restart wipes it.
    - type: tmpfs
      target: /tmp
      tmpfs:
        size: 536870912 # 512 MiB
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  relay:
    # -hardware variant: Debian 13 with Intel iHD for the VAAPI *_sub transcodes.
    image: alexxit/go2rtc:1.9.9-hardware@sha256:7d78c5843ca6bbe6bdd1f3cfd5a7708c7a6a30817c2996113de000cf09fcd741
    container_name: protect-bridge-relay
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    # Supplies the ${...} values used in go2rtc.yaml.
    env_file: .env
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Reolink Elite Floodlight WiFi "Elite Sophia", firmware v3.2.0.5607:
  # main H.265 5120x1552@20 (3 Mbps).
  elite-sophia:
    <<: *proxy
    build:
      context: ../..
      dockerfile: Dockerfile.vaapi
    container_name: protect-bridge-elite-sophia
    command:
      - unifi-cam-proxy
      - --host
      - "${NVR_IP}"
      - --cert
      - /client.pem
      - --token
      - "${ADOPTION_TOKEN}"
      - --mac
      - "${CAM_MAC}"
      - --ip
      - "${CAM_IP}"
      - --name
      - "${CAM_NAME}"
      # Full UVC G5 Pro identity (unlocks Protect's H.265 capability gate).
      - --model
      - "UVC G5 Pro"
      - --sysid
      - "0xa598"
      - --platform
      - "sav837gw"
      - --fw-version
      - "5.4.132"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - "rtsp://${RELAY_USER}:${RELAY_PASS}@127.0.0.1:8554/elite_sophia"
      - --reolink-ai-host
      - "${CAM_IP}"
      - --reolink-ai-user
      - "${CAM_USER}"
      - --reolink-ai-password
      - "${CAM_PASS}"
      - --reolink-scheme
      - http
      - --reolink-snapshot
      - --reolink-push-ai
      # ffmpeg 7.1 stalls on copied Reolink audio (the muxer holds all video
      # for 10 s and Protect times out): re-encode it, 16 kHz mono as the
      # camera sends it, on every channel.
      - --ffmpeg-args
      - "-c:v copy -ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --lo-audio-args
      - "-ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --hi-codec
      - h265
      - --hi-width
      - "5120"
      - --hi-height
      - "1552"
      - --hi-fps
      - "20"
      - --lo-codec
      - h265
      - --lo-h265-transcode
      - --lo-scale
      - --lo-decode
      - cpu
      - --lo-width
      - "1920"
      - --lo-height
      - "576"
      - --lo-fps
      - "20"

  # Reolink OMVI 3i PoE "Back Gate" (wired), firmware v3.2.0.6905:
  # main H.265 4096x1536@20 (6 Mbps). Same password as Elite Sophia.
  back-gate:
    <<: *proxy
    container_name: protect-bridge-back-gate
    command:
      - unifi-cam-proxy
      - --host
      - "${NVR_IP}"
      - --cert
      - /client.pem
      - --token
      - "${BG_ADOPTION_TOKEN}"
      - --mac
      - "${BG_MAC}"
      - --ip
      - "${BG_IP}"
      - --name
      - "${BG_NAME}"
      - --model
      - "UVC G5 Pro"
      - --sysid
      - "0xa598"
      - --platform
      - "sav837gw"
      - --fw-version
      - "5.4.132"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - "rtsp://${RELAY_USER}:${RELAY_PASS}@127.0.0.1:8554/back_gate"
      - --reolink-ai-host
      - "${BG_IP}"
      - --reolink-ai-user
      - "${CAM_USER}"
      - --reolink-ai-password
      - "${CAM_PASS}"
      - --reolink-scheme
      - http
      - --reolink-snapshot
      - --reolink-push-ai
      # ffmpeg 7.1 stalls on copied Reolink audio (the muxer holds all video
      # for 10 s and Protect times out): re-encode it, 16 kHz mono as the
      # camera sends it, on every channel.
      - --ffmpeg-args
      - "-c:v copy -ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --lo-audio-args
      - "-ar 16000 -ac 1 -codec:a aac -b:a 32k"
      - --hi-codec
      - h265
      - --hi-width
      - "4096"
      - --hi-height
      - "1536"
      - --hi-fps
      - "20"
      - --lo-codec
      - h265
      - --lo-h265-transcode
      - --lo-scale
      - --lo-decode
      - cpu
      # Trial 2026-10-19: restart a stalled stream after 15 s, not 45 s, to
      # shorten the gaps the garage link causes (each restart is a "Stream
      # recovery" event in Protect). Revisit after the garage fiber.
      - --stream-silence-limit
      - "15"
      - --stream-watchdog-interval
      - "5"
      - --lo-width
      - "1920"
      - --lo-height
      - "720"
      - --lo-fps
      - "20"
